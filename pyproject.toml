[project]
name = "libxiangqi"
version = "0.1.0"
description = "Python Xiangqi library"
readme = "README.md"
authors = [
  { name = "hbhungg", email = "hung.ba.huynh@proton.me" }
]
classifiers = [
  "Programming Language :: Python",
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libxiangqi"]

[dependency-groups]
dev = [
  "mkdocs-material>=9.7.1",
  "mypy>=1.19.0",
  "pytest>=9.0.2",
  "ruff>=0.14.10",
]

[tool.ruff]
line-length = 150
indent-width = 2
preview = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
skip-magic-trailing-comma = true
